<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 1200px; margin: auto; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); background-color: white; border-radius: 8px; overflow: hidden; }
        th, td { border-bottom: 1px solid #ddd; padding: 12px 15px; text-align: left; vertical-align: middle; }
        thead th { background-color: #007bff; color: white; font-weight: bold; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .actions a, .actions button { display: inline-block; text-decoration: none; cursor: pointer; padding: 6px 12px; border: none; border-radius: 4px; margin: 2px; color: white; font-size: 14px; transition: opacity 0.2s; min-width: 80px; text-align: center; }
        .actions a:hover, .actions button:hover { opacity: 0.8; }
        .details-btn { background-color: #17a2b8; }
        .qr-btn { background-color: #ffc107; color: black; }
        .edit-btn { background-color: #28a745; }
        .delete-btn { background-color: #dc3545; }
        .nav-links { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { margin-right: 20px; font-size: 18px; color: #007bff; text-decoration: none; font-weight: 500; }

        /* === CSS CHO CÁC TÍNH NĂNG MỚI === */

        .reviews-btn { background-color: #6f42c1; } 
        .barcode-btn { background-color: #343a40; } 

        .modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            overflow: auto; background-color: rgba(0,0,0,0.6);
        }
        .modal-content {
            background-color: #fefefe; margin: 10% auto; padding: 20px;
            border: 1px solid #888; width: 60%; max-width: 700px;
            border-radius: 8px; box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #dee2e6; padding-bottom: 1rem;
        }
        .modal-header h2 { margin: 0; border-bottom: none; padding-bottom: 0; font-size: 1.5rem; }
        .close-button { color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-button:hover, .close-button:focus { color: black; text-decoration: none; }
        #reviewsList { margin-top: 15px; max-height: 400px; overflow-y: auto; }
        .review-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .review-item:last-child { border-bottom: none; }
        .review-item p { margin: 5px 0; }
        .review-author { font-weight: bold; }
        .review-rating { color: #f9ca24; }
        
        /* CSS cho mục Hoạt động gần đây (activity log) */
       .notification-area {
            position: relative;
            display: inline-block;
        }
        #notification-bell {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            padding: 5px;
        }
        #notification-badge {
            position: absolute;
            top: 0px;
            right: 0px;
            padding: 2px 5px;
            border-radius: 50%;
            background-color: #dc3545;
            color: white;
            font-size: 10px;
            font-weight: bold;
            display: none; /* Sẽ hiện lên bằng JS */
        }
        .notification-dropdown {
            display: none; /* Sẽ hiện lên bằng JS */
            position: absolute;
            right: 0;
            top: 120%; /* Đặt dropdown bên dưới chuông */
            background-color: #ffffff;
            min-width: 350px;
            max-width: 400px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1001;
            border-radius: 8px;
            border: 1px solid #ddd;
            max-height: 500px;
            overflow-y: auto;
        }
        .notification-dropdown h4 {
            padding: 10px 15px;
            margin: 0;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
            font-size: 1rem;
            color: #495057;
        }
        .notification-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .notification-item {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .notification-item:hover {
            background-color: #e9ecef;
        }
        .notification-item:last-child {
            border-bottom: none;
        }
        .notification-item p, .notification-item small {
            margin: 0;
            line-height: 1.4;
        }
        .notification-item small {
            font-size: 0.75rem;
            color: #6c757d;
        }
        .no-notifications {
            padding: 20px;
            text-align: center;
            color: #6c757d;
            cursor: default;
        }
    </style>
</head>
<body>
    <h1>Quản lý Sản phẩm</h1>
    <div class="nav-links">
        <div class="nav-links-left">
            <a href="/dashboard.html">Về Dashboard</a>
            <a href="/new-product.html">Thêm Sản phẩm Mới</a>
            <a href="/employee-info.html">Quản Lý Nhân Viên</a>
            <a href="/message.html">Tin Nhắn Nội Bộ</a>
        </div>
    
     <div class="nav-links-right">
            <input type="text" id="search-input" placeholder="Tìm kiếm..." style="padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc;">
            
            <div class="notification-area">
                <button id="notification-bell">
                    <span>🔔</span>
                    <span id="notification-badge"></span>
                </button>
                <div id="notification-dropdown" class="notification-dropdown">
                    <h4>Tin Nhắn Mới</h4>
                    <ul id="message-list" class="notification-list">
                        <li class="no-notifications">Không có tin nhắn mới.</li>
                    </ul>
                    <h4>Hoạt động gần đây</h4>
                    <ul id="activity-list" class="notification-list">
                        <li class="no-notifications">Đang tải...</li>
                    </ul>
               <div class="theme-switcher">
    <span>☀️</span>
    <label class="switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider round"></span>
    </label>
    <span>🌙</span>
</div>
                </div>
            </div>
        </div>
    </div>
    
    <table>
        <thead><tr><th>STT</th><th>Mã SP</th><th>Tên Sản phẩm (VI)</th><th>Người tạo</th><th>Ngày tạo</th><th>Hành động / Actions</th></tr></thead>
        <tbody id="product-table-body"></tbody>
    </table>

    <div id="reviewsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Đánh giá cho sản phẩm: <span id="modalProductName"></span></h2>
                <span class="close-button">&times;</span>
            </div>
            <div id="reviewsList"></div>
        </div>
    </div>
    <script>
    /**
     * @file product-list.html
     * @version 3.0
     * @description Script hoàn chỉnh để quản lý sản phẩm, tích hợp chuông thông báo
     * và chế độ Sáng/Tối (Day/Night mode) theo từng người dùng.
     */

    // =======================================================
    // === KHAI BÁO BIẾN TOÀN CỤC
    // =======================================================
    let allProducts = [];    // Lưu trữ toàn bộ danh sách sản phẩm để tìm kiếm
    let currentUser = null;  // Lưu thông tin người dùng đang đăng nhập, bao gồm cả theme

    // =======================================================
    // === CÁC HÀM RENDER GIAO DIỆN (UI)
    // =======================================================

    /**
     * Render danh sách sản phẩm ra bảng.
     * @param {Array<Object>} products - Mảng các đối tượng sản phẩm cần hiển thị.
     */
    function renderProducts(products) {
        const tableBody = document.getElementById('product-table-body');
        tableBody.innerHTML = '';
        if (products && products.length > 0) {
            products.forEach((product, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${product.id || 'N/A'}</td>
                    <td>${product.name_vi || 'N/A'}</td>
                    <td>${product.created_by_name || 'N/A'}</td>
                    <td>${new Date(product.created_at).toLocaleString('vi-VN')}</td>
                    <td class="actions">
                        <a href="/product-view.html?id=${product.id}" target="_blank" class="details-btn">Chi tiết</a>
                        <a href="/qr-view.html?id=${product.id}" target="_blank" class="qr-btn">Xem QR</a>
                        <a href="/barcode.html?id=${product.id}" target="_blank" class="barcode-btn">Xem Barcode</a>
                        <a href="/edit-product.html?id=${product.id}" class="edit-btn">Sửa</a>
                        <button class="reviews-btn" data-id="${product.id}" data-name="${product.name_vi || ''}">Xem Đ.giá</button>
                        <button class="delete-btn" data-id="${product.id}">Xóa</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } else {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Không có sản phẩm nào.</td></tr>';
        }
    }

    /**
     * Hiển thị modal chứa các đánh giá của một sản phẩm.
     * @param {string} productId - ID của sản phẩm.
     * @param {string} productName - Tên của sản phẩm.
     */
    async function showReviews(productId, productName) {
        const modal = document.getElementById('reviewsModal');
        const modalProductName = document.getElementById('modalProductName');
        const reviewsListDiv = document.getElementById('reviewsList');

        modalProductName.textContent = productName; 
        reviewsListDiv.innerHTML = '<p>Đang tải đánh giá...</p>';
        modal.style.display = 'block';

        try {
            const response = await fetch(`/api/products/${productId}/reviews`);
            if (!response.ok) throw new Error(`Lỗi server: ${response.status}`);
            const data = await response.json();

            if (data.reviews && data.reviews.length > 0) {
                let reviewsHtml = '';
                data.reviews.forEach(review => {
                    const stars = '⭐'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
                    reviewsHtml += `
                        <div class="review-item">
                            <p class="review-author">Tên: ${review.author_name}</p>
                            <p class="review-rating">Đánh giá: ${stars}</p>
                            <p class="review-comment">Bình luận: ${review.comment || '<i>Không có bình luận</i>'}</p>
                            <p><small>${new Date(review.created_at).toLocaleString('vi-VN')}</small></p>
                        </div>
                    `;
                });
                reviewsListDiv.innerHTML = reviewsHtml;
            } else {
                reviewsListDiv.innerHTML = '<p>Chưa có đánh giá nào cho sản phẩm này.</p>';
            }
        } catch (error) {
            console.error('Lỗi khi tải đánh giá:', error);
            reviewsListDiv.innerHTML = '<p style="color: red;">Không thể tải danh sách đánh giá.</p>';
        }
    }

    // =======================================================
    // === CÁC HÀM QUẢN LÝ THEME (DAY/NIGHT MODE)
    // =======================================================
    
    /**
     * Áp dụng theme (light/dark) vào trang và cập nhật trạng thái nút gạt.
     * @param {string} theme - Tên theme ('light' hoặc 'dark').
     */
    function applyTheme(theme) {
        const toggle = document.getElementById('theme-toggle');
        if (theme === 'dark') {
            document.body.classList.add('dark-mode');
            if (toggle) toggle.checked = true;
        } else {
            document.body.classList.remove('dark-mode');
            if (toggle) toggle.checked = false;
        }
    }

    /**
     * Gửi yêu cầu lên server để lưu lựa chọn theme mới vào CSDL cho người dùng.
     * @param {string} theme - Tên theme mới ('light' hoặc 'dark').
     */
    async function saveThemePreference(theme) {
        // Chỉ gửi yêu cầu nếu người dùng đã đăng nhập
        if (!currentUser) return;

        try {
            await fetch('/api/user/theme', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ theme: theme })
            });
            // Cập nhật lại theme trong biến currentUser để đồng bộ
            currentUser.theme = theme;
            console.log(`Lưu theme '${theme}' cho người dùng thành công.`);
        } catch (error) {
            console.error("Lỗi khi lưu theme:", error);
        }
    }

    // =======================================================
    // === CÁC HÀM TẢI DỮ LIỆU TỪ SERVER
    // =======================================================

    /**
     * Tải danh sách sản phẩm từ API và render ra bảng.
     */
    function loadProducts() {
        fetch('/api/products')
            .then(response => {
                if (!response.ok) throw new Error(`Lỗi khi tải dữ liệu sản phẩm: ${response.status}`);
                return response.json();
            })
            .then(data => {
                allProducts = data.products || data || [];
                renderProducts(allProducts);
            })
            .catch(error => {
                console.error('Chi tiết lỗi tải sản phẩm:', error);
                document.getElementById('product-table-body').innerHTML = `<tr><td colspan="6" style="text-align:center; color: red;">Không thể tải danh sách sản phẩm.</td></tr>`;
            });
    }

    /**
     * Tải đồng thời cả hoạt động và tin nhắn chưa đọc, sau đó cập nhật chuông thông báo.
     */
    async function updateNotifications() {
        const activityListEl = document.getElementById('activity-list');
        const messageListEl = document.getElementById('message-list');
        const badgeEl = document.getElementById('notification-badge');

        try {
            const [activityResponse, messagesResponse] = await Promise.all([
                fetch('/api/activity-log'),
                fetch('/api/messages') 
            ]);

            // Xử lý Hoạt động gần đây
            if (activityResponse.ok) {
                const activityData = await activityResponse.json();
                activityListEl.innerHTML = '';
                if (activityData.activities && activityData.activities.length > 0) {
                    activityData.activities.slice(0, 7).forEach(act => {
                        const item = document.createElement('li');
                        item.className = 'notification-item';
                        item.style.cursor = 'default';
                        item.innerHTML = `<p>${act.details}</p><small>Bởi: <strong>${act.user_name}</strong> - ${new Date(act.created_at).toLocaleString('vi-VN')}</small>`;
                        activityListEl.appendChild(item);
                    });
                } else {
                    activityListEl.innerHTML = '<li class="no-notifications">Không có hoạt động nào.</li>';
                }
            } else {
                 activityListEl.innerHTML = '<li class="no-notifications" style="color:red;">Lỗi tải hoạt động.</li>';
            }

            // Xử lý Tin nhắn mới
            if (messagesResponse.ok) {
                const messageData = await messagesResponse.json();
                const unreadMessages = messageData.messages.filter(msg => !msg.is_read);
                
                messageListEl.innerHTML = '';
                if (unreadMessages.length > 0) {
                    unreadMessages.forEach(msg => {
                        const item = document.createElement('li');
                        item.className = 'notification-item';
                        item.title = `Click để xem chi tiết và đánh dấu đã đọc`;
                        item.onclick = () => {
                            fetch(`/api/messages/${msg.id}/read`, { method: 'PUT' });
                            window.location.href = '/message.html';
                        };
                        item.innerHTML = `<p><strong>Từ: ${msg.sender_name}</strong></p><p>${msg.title}</p><small>${new Date(msg.created_at).toLocaleString('vi-VN')}</small>`;
                        messageListEl.appendChild(item);
                    });
                } else {
                    messageListEl.innerHTML = '<li class="no-notifications">Không có tin nhắn mới.</li>';
                }

                // Cập nhật số trên huy hiệu của chuông
                if (unreadMessages.length > 0) {
                    badgeEl.textContent = unreadMessages.length;
                    badgeEl.style.display = 'block';
                } else {
                    badgeEl.style.display = 'none';
                }
            } else {
                 messageListEl.innerHTML = '<li class="no-notifications" style="color:red;">Lỗi tải tin nhắn.</li>';
            }

        } catch (error) {
            console.error("Lỗi khi tải thông báo:", error);
            activityListEl.innerHTML = '<li class="no-notifications" style="color:red;">Lỗi hệ thống khi tải thông báo.</li>';
        }
    }

    // =======================================================
    // === GẮN CÁC SỰ KIỆN VÀ KHỞI TẠO TRANG
    // =======================================================

    /**
     * Hàm khởi tạo chính của trang, chạy khi DOM đã được tải hoàn toàn.
     */
    async function initializePage() {
        try {
            // Lấy thông tin người dùng hiện tại, bao gồm cả theme đã lưu
            const response = await fetch('/api/me');
            if (!response.ok) {
                // Nếu không lấy được thông tin (chưa đăng nhập), chuyển về trang login
                console.log("Người dùng chưa đăng nhập, chuyển hướng...");
                window.location.href = '/login.html';
                return;
            }
            currentUser = await response.json();
            
            // 1. Áp dụng theme của user ngay lập tức
            applyTheme(currentUser.theme);

            // 2. Tải các dữ liệu khác cho trang
            loadProducts();
            updateNotifications();

        } catch (error) {
            console.error("Lỗi khởi tạo trang:", error);
            // Có thể chuyển về trang login nếu có lỗi nghiêm trọng
            window.location.href = '/login.html';
        }
    }

    // Gắn sự kiện chính khi trang được tải xong
    document.addEventListener('DOMContentLoaded', initializePage);

    // Gắn sự kiện cho nút gạt theme
    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('change', () => {
            const newTheme = themeToggle.checked ? 'dark' : 'light';
            applyTheme(newTheme); // Áp dụng ngay lập tức để người dùng thấy thay đổi
            saveThemePreference(newTheme); // Gửi lên server để lưu lại cho lần đăng nhập sau
        });
    }

    // Gắn sự kiện cho ô tìm kiếm
    document.getElementById('search-input').addEventListener('input', e => {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = allProducts.filter(p => 
            (p.id && p.id.toLowerCase().includes(searchTerm)) || 
            (p.name_vi && p.name_vi.toLowerCase().includes(searchTerm)) || 
            (p.created_by_name && p.created_by_name.toLowerCase().includes(searchTerm))
        );
        renderProducts(filtered);
    });

    // Gắn sự kiện click cho bảng sản phẩm (Xóa, Xem đánh giá)
    document.getElementById('product-table-body').addEventListener('click', e => {
        const target = e.target;
        if (target && target.classList.contains('delete-btn')) {
            const productId = target.dataset.id;
            if (confirm(`Bạn có chắc chắn muốn xóa sản phẩm có mã "${productId}" không?`)) {
                fetch(`/api/products/${productId}`, { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        alert('Xóa thành công!');
                        loadProducts(); // Tải lại danh sách sản phẩm
                        updateNotifications(); // Cập nhật lại hoạt động gần đây
                    } else {
                        alert(`Xóa thất bại! Server báo lỗi: ${response.status}.`);
                    }
                })
                .catch(error => alert('Lỗi mạng! Không thể gửi yêu cầu xóa.'));
            }
        }
        if (target && target.classList.contains('reviews-btn')) {
            showReviews(target.dataset.id, target.dataset.name);
        }
    });
    
    // Gắn sự kiện cho chuông thông báo
    const notificationBell = document.getElementById('notification-bell');
    const notificationDropdown = document.getElementById('notification-dropdown');
    notificationBell.addEventListener('click', (event) => {
        event.stopPropagation();
        const isHidden = notificationDropdown.style.display === 'none';
        notificationDropdown.style.display = isHidden ? 'block' : 'none';
        if (isHidden) {
            updateNotifications();
        }
    });

    // Gắn sự kiện để đóng dropdown khi click ra ngoài
    window.addEventListener('click', (event) => {
        if (!notificationBell.contains(event.target) && !notificationDropdown.contains(event.target)) {
            notificationDropdown.style.display = 'none';
        }
    });

</script>
</body>
</html>
