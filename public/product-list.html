<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm - Bảng Điều Khiển</title>
    
    <style>
        /* === CSS BIẾN MÀU CHO THEME === */
        :root {
            --bg-color: #f8f9fa; --card-bg-color: #ffffff; --text-color: #212529;
            --text-muted-color: #6c757d; --border-color: #dee2e6; --primary-color: #007bff;
            --header-bg: #343a40; --success-color: #28a745; --danger-color: #dc3545;
            --info-color: #17a2b8; --warning-color: #ffc107; --secondary-color: #6f42c1;
        }
        body.dark-mode {
            --bg-color: #121212; --card-bg-color: #1e1e1e; --text-color: #e0e0e0;
            --text-muted-color: #888; --border-color: #444; --primary-color: #0d6efd;
            --header-bg: #212529; --success-color: #20c997; --danger-color: #fd7e14;
            --info-color: #0dcaf0; --warning-color: #ffc107; --secondary-color: #845ef7;
        }

        /* === CSS CƠ BẢN (Đã áp dụng biến màu) === */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 1400px; margin: auto; padding: 20px; background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--text-color); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); background-color: var(--card-bg-color); border-radius: 8px; overflow: hidden; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 12px 15px; text-align: left; vertical-align: middle; }
        thead th { background-color: var(--header-bg); color: white; font-weight: bold; }
        tr:nth-child(even) { background-color: rgba(128, 128, 128, 0.05); }
        tr:hover { background-color: rgba(128, 128, 128, 0.1); }
        .actions a, .actions button { display: inline-block; text-decoration: none; cursor: pointer; padding: 6px 12px; border: none; border-radius: 4px; margin: 2px; color: white; font-size: 14px; transition: opacity 0.2s; min-width: 80px; text-align: center; font-weight: 500;}
        .actions a:hover, .actions button:hover { opacity: 0.8; }
        .details-btn { background-color: var(--info-color); }
        .qr-btn { background-color: var(--warning-color); color: black; }
        .edit-btn { background-color: var(--success-color); }
        .delete-btn { background-color: var(--danger-color); }
        .nav-links { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .nav-links-left a { margin-right: 20px; font-size: 18px; color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .nav-links-right { display: flex; align-items: center; gap: 20px; }
        #search-input { background-color: var(--card-bg-color); color: var(--text-color); border: 1px solid var(--border-color); }

        /* === CSS CHO CÁC TÍNH NĂNG KHÁC === */
        .reviews-btn { background-color: var(--secondary-color); } 
        .barcode-btn { background-color: #c442ac; } 
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: var(--card-bg-color); color: var(--text-color); margin: 10% auto; padding: 20px; border: 1px solid var(--border-color); width: 60%; max-width: 700px; border-radius: 8px; box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .modal-header h2 { margin: 0; border-bottom: none; padding-bottom: 0; font-size: 1.5rem; }
        .close-button { color: var(--text-muted-color); font-size: 28px; font-weight: bold; cursor: pointer; }
        #reviewsList { margin-top: 15px; max-height: 400px; overflow-y: auto; }
        .review-item { border-bottom: 1px solid var(--border-color); padding: 10px 0; }
        .review-author { font-weight: bold; }
        .review-rating { color: #f9ca24; }
        
        /* === CSS CHO CHUÔNG THÔNG BÁO === */
        .notification-area { position: relative; display: inline-block; }
        #notification-bell { font-size: 24px; background: none; border: none; cursor: pointer; position: relative; padding: 5px; color: var(--text-color); }
        #notification-badge { position: absolute; top: 0px; right: 0px; padding: 2px 5px; border-radius: 50%; background-color: var(--danger-color); color: white; font-size: 10px; font-weight: bold; display: none; }
        .notification-dropdown { display: none; position: absolute; right: 0; top: 120%; background-color: var(--card-bg-color); min-width: 350px; max-width: 400px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1001; border-radius: 8px; border: 1px solid var(--border-color); max-height: 500px; overflow-y: auto; }
        .notification-dropdown h4 { padding: 10px 15px; margin: 0; background-color: var(--bg-color); border-bottom: 1px solid var(--border-color); font-size: 1rem; color: var(--text-color); }
        .notification-list { list-style: none; padding: 0; margin: 0; }
        .notification-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background-color 0.2s; }
        .notification-item:hover { background-color: rgba(128, 128, 128, 0.1); }
        .notification-item:last-child { border-bottom: none; }
        .notification-item p, .notification-item small { margin: 0; line-height: 1.4; }
        .notification-item small { font-size: 0.75rem; color: var(--text-muted-color); }
        .no-notifications { padding: 20px; text-align: center; color: var(--text-muted-color); cursor: default; }

        /* CSS cho nút gạt theme */
        .theme-switcher { display: flex; align-items: center; gap: 8px; }
        .theme-switcher span { font-size: 1.2rem; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
    
    <script>
      (function() {
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch(e) {}
      })();
    </script>
</head>
<body class="dark-mode"> <h1>Quản lý Sản phẩm</h1>
    <div class="nav-links">
        <div class="nav-links-left">
            <a href="/dashboard.html">Về Dashboard</a>
            <a href="/new-product.html" id="add-product-link">Thêm Sản phẩm Mới</a>
            <a href="/employee-info.html" id="employee-info-link">Quản Lý Nhân Viên</a>
            <a href="/message.html">Tin Nhắn Nội Bộ</a>
        </div>
        
        <div class="nav-links-right">
            <input type="text" id="search-input" placeholder="Tìm kiếm..." style="padding: 10px; font-size: 16px; border-radius: 5px;">
            
            <div class="theme-switcher">
                <span>☀️</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider round"></span>
                </label>
                <span>🌙</span>
            </div>

            <div class="notification-area">
                <button id="notification-bell">
                    <span>🔔</span>
                    <span id="notification-badge"></span>
                </button>
                <div id="notification-dropdown" class="notification-dropdown">
                    <h4>Tin Nhắn Mới</h4>
                    <ul id="message-list" class="notification-list"></ul>
                    <h4>Hoạt động gần đây</h4>
                    <ul id="activity-list" class="notification-list"></ul>
                </div>
            </div>
        </div>
    </div>
    
    <table>
        <thead><tr><th>STT</th><th>Mã SP</th><th>Tên Sản phẩm (VI)</th><th>Người tạo</th><th>Ngày tạo</th><th>Hành động / Actions</th></tr></thead>
        <tbody id="product-table-body"></tbody>
    </table>

    <div id="reviewsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Đánh giá cho sản phẩm: <span id="modalProductName"></span></h2>
                <span class="close-button">&times;</span>
            </div>
            <div id="reviewsList"></div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let currentUser = null;

        function renderProducts(products) {
            const tableBody = document.getElementById('product-table-body');
            tableBody.innerHTML = '';
            if (products && products.length > 0) {
                products.forEach((product, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${product.id || 'N/A'}</td>
                        <td>${product.name_vi || 'N/A'}</td>
                        <td>${product.created_by_name || 'N/A'}</td>
                        <td>${new Date(product.created_at).toLocaleString('vi-VN')}</td>
                        <td class="actions">
                            <a href="/product-view.html?id=${product.id}" target="_blank" class="details-btn">Chi tiết</a>
                            <a href="/qr-view.html?id=${product.id}" target="_blank" class="qr-btn">Xem QR</a>
                            <a href="/barcode.html?id=${product.id}" target="_blank" class="barcode-btn">Xem Barcode</a>
                            <a href="/edit-product.html?id=${product.id}" class="edit-btn">Sửa</a>
                            <button class="reviews-btn" data-id="${product.id}" data-name="${product.name_vi || ''}">Xem Đ.giá</button>
                            <button class="delete-btn" data-id="${product.id}">Xóa</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } else {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Không có sản phẩm nào.</td></tr>';
            }
        }

        async function showReviews(productId, productName) {
            const modal = document.getElementById('reviewsModal');
            const modalProductName = document.getElementById('modalProductName');
            const reviewsListDiv = document.getElementById('reviewsList');
            modalProductName.textContent = productName; 
            reviewsListDiv.innerHTML = '<p>Đang tải đánh giá...</p>';
            modal.style.display = 'block';

            try {
                const response = await fetch(`/api/products/${productId}/reviews`);
                if (!response.ok) throw new Error(`Lỗi server: ${response.status}`);
                const data = await response.json();
                if (data.reviews && data.reviews.length > 0) {
                    let reviewsHtml = '';
                    data.reviews.forEach(review => {
                        const stars = '⭐'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
                        reviewsHtml += `<div class="review-item"><p class="review-author">Tên: ${review.author_name}</p><p class="review-rating">Đánh giá: ${stars}</p><p>Bình luận: ${review.comment || '<i>Không có</i>'}</p><p><small>${new Date(review.created_at).toLocaleString('vi-VN')}</small></p></div>`;
                    });
                    reviewsListDiv.innerHTML = reviewsHtml;
                } else {
                    reviewsListDiv.innerHTML = '<p>Chưa có đánh giá nào cho sản phẩm này.</p>';
                }
            } catch (error) {
                reviewsListDiv.innerHTML = '<p style="color: red;">Không thể tải danh sách đánh giá.</p>';
            }
        }
        
        function applyTheme(theme) {
            const toggle = document.getElementById('theme-toggle');
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                if (toggle) toggle.checked = true;
            } else {
                document.body.classList.remove('dark-mode');
                if (toggle) toggle.checked = false;
            }
        }

        async function saveThemePreference(theme) {
            if (!currentUser) return;
            try {
                await fetch('/api/user/theme', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme: theme })
                });
                currentUser.theme = theme;
            } catch (error) { console.error("Lỗi khi lưu theme:", error); }
        }

        function loadProducts() {
            fetch('/api/products')
                .then(res => res.ok ? res.json() : Promise.reject(res))
                .then(data => {
                    allProducts = data.products || data || [];
                    renderProducts(allProducts);
                })
                .catch(error => {
                    document.getElementById('product-table-body').innerHTML = `<tr><td colspan="6" style="text-align:center; color: red;">Không thể tải danh sách sản phẩm.</td></tr>`;
                });
        }

        async function updateNotifications() {
            const activityListEl = document.getElementById('activity-list');
            const messageListEl = document.getElementById('message-list');
            const badgeEl = document.getElementById('notification-badge');
            try {
                const [activityResponse, messagesResponse] = await Promise.all([
                    fetch('/api/activity-log'),
                    fetch('/api/messages') 
                ]);

                if (activityResponse.ok) {
                    const data = await activityResponse.json();
                    activityListEl.innerHTML = (data.activities && data.activities.length) 
                        ? data.activities.slice(0, 7).map(act => `<li class="notification-item" style="cursor:default;"><p>${act.details}</p><small>Bởi: <strong>${act.user_name}</strong> - ${new Date(act.created_at).toLocaleString('vi-VN')}</small></li>`).join('')
                        : '<li class="no-notifications">Không có hoạt động nào.</li>';
                } else {
                         activityListEl.innerHTML = '<li class="no-notifications" style="color:red;">Lỗi tải hoạt động.</li>';
                }

                if (messagesResponse.ok) {
                    const data = await messagesResponse.json();
                    const unread = data.messages.filter(msg => !msg.is_read);
                    messageListEl.innerHTML = (unread.length > 0)
                        ? unread.map(msg => `<li class="notification-item" title="Click để xem" onclick="readMessage(${msg.id})"><p><strong>Từ: ${msg.sender_name}</strong></p><p>${msg.title}</p><small>${new Date(msg.created_at).toLocaleString('vi-VN')}</small></li>`).join('')
                        : '<li class="no-notifications">Không có tin nhắn mới.</li>';
                    
                    badgeEl.style.display = unread.length > 0 ? 'block' : 'none';
                    badgeEl.textContent = unread.length;
                } else {
                         messageListEl.innerHTML = '<li class="no-notifications" style="color:red;">Lỗi tải tin nhắn.</li>';
                }
            } catch (error) {
                console.error("Lỗi khi tải thông báo:", error);
            }
        }
        
        function readMessage(id) {
            fetch(`/api/messages/${id}/read`, { method: 'PUT' });
            window.location.href = '/message.html';
        }

        function attachEventListeners() {
            document.getElementById('theme-toggle').addEventListener('change', function() {
                const newTheme = this.checked ? 'dark' : 'light';
                applyTheme(newTheme);
                saveThemePreference(newTheme);
            });

            document.getElementById('search-input').addEventListener('input', e => {
                const searchTerm = e.target.value.toLowerCase();
                const filtered = allProducts.filter(p => (p.id?.toLowerCase().includes(searchTerm)) || (p.name_vi?.toLowerCase().includes(searchTerm)));
                renderProducts(filtered);
            });
            
            document.getElementById('product-table-body').addEventListener('click', e => {
                const target = e.target.closest('button');
                if (!target) return;

                if (target.classList.contains('delete-btn')) {
                    const isAdmin = currentUser && currentUser.employeeId === 'KT01IT';
                    if (!isAdmin) {
                        alert('Bạn không có quyền xóa danh mục này.');
                        return;
                    }
                    const productId = target.dataset.id;
                    if (confirm(`Bạn có chắc muốn xóa sản phẩm mã "${productId}"?`)) {
                        fetch(`/api/products/${productId}`, { method: 'DELETE' })
                        .then(res => res.ok ? (alert('Xóa thành công!'), loadProducts(), updateNotifications()) : alert(`Xóa thất bại: ${res.status}`))
                        .catch(err => alert('Lỗi mạng!'));
                    }
                }
                if (target.classList.contains('reviews-btn')) {
                    showReviews(target.dataset.id, target.dataset.name);
                }
            });

            const modal = document.getElementById('reviewsModal');
            const closeButton = modal.querySelector('.close-button');
            closeButton.onclick = () => modal.style.display = 'none';
            window.onclick = (event) => { if (event.target == modal) modal.style.display = 'none'; };
            
            const notificationBell = document.getElementById('notification-bell');
            const notificationDropdown = document.getElementById('notification-dropdown');
            notificationBell.addEventListener('click', e => {
                e.stopPropagation();
                const isHidden = notificationDropdown.style.display === 'none';
                notificationDropdown.style.display = isHidden ? 'block' : 'none';
                if (isHidden) updateNotifications();
            });
            window.addEventListener('click', e => {
                if (!notificationBell.contains(e.target) && !notificationDropdown.contains(e.target)) {
                    notificationDropdown.style.display = 'none';
                }
            });

            const addProductLink = document.getElementById('add-product-link');
            if (addProductLink) {
                addProductLink.addEventListener('click', function(event) {
                    const isAdmin = currentUser && currentUser.employeeId === 'KT01IT';
                    if (!isAdmin) {
                        event.preventDefault();

                        const permissionModal = document.createElement('div');
                        permissionModal.innerHTML = `
                            <div id="permission-denied-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 2000;">
                                <div style="background-color: var(--card-bg-color); color: var(--text-color); padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); max-width: 400px;">
                                    <h3 style="margin-top: 0; color: var(--danger-color);">Truy cập bị từ chối</h3>
                                    <p>Xin lỗi, bạn không có thẩm quyền để vào trang này.</p>
                                    <button id="close-permission-modal" style="padding: 10px 20px; border-radius: 5px; border: none; background-color: var(--primary-color); color: white; cursor: pointer; margin-top: 15px; font-weight: bold;">Đã hiểu</button>
                                </div>
                            </div>
                        `;
                        document.body.appendChild(permissionModal);
                        
                        document.getElementById('close-permission-modal').addEventListener('click', () => {
                            document.body.removeChild(permissionModal);
                        });
                    }
                });
            }
        }
        
        // === HÀM MỚI ĐỂ KIỂM TRA QUYỀN TRUY CẬP CÁC TRANG ===
        function applyNavigationPermissions() {
            // Danh sách các vai trò được phép vào trang Quản lý nhân viên
            const employeePageRoles = ['KT01IT', 'KT01GD', 'KT02GD'];
            const employeeLink = document.getElementById('employee-info-link');

            // Ẩn link nếu vai trò người dùng không nằm trong danh sách
            if (employeeLink && !employeePageRoles.includes(currentUser.employeeId)) {
                employeeLink.style.display = 'none';
            }

            // (Có thể thêm các quy tắc ẩn/hiện link khác ở đây trong tương lai)
        }

        async function initializePage() {
            try {
                const response = await fetch('/api/me');
                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                currentUser = await response.json();
                
                applyTheme(currentUser.theme);
                loadProducts();
                updateNotifications();
                attachEventListeners();

                // GỌI HÀM KIỂM TRA QUYỀN TRÊN THANH ĐIỀU HƯỚNG
                applyNavigationPermissions();

            } catch (error) {
                console.error("Lỗi khởi tạo trang:", error);
                window.location.href = '/login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', initializePage);

    </script>
</body>
</html>
