<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Upload File</title>
    
    <style>
        :root {
            --bg-color: #f8f9fa; --card-bg-color: #ffffff; --text-color: #212529;
            --text-muted-color: #6c757d; --border-color: #dee2e6; --primary-color: #007bff;
            --success-color: #28a745; --danger-color: #dc3545;
        }
        body.dark-mode {
            --bg-color: #121212; --card-bg-color: #1e1e1e; --text-color: #e0e0e0;
            --text-muted-color: #888; --border-color: #444; --primary-color: #0d6efd;
            --success-color: #20c997; --danger-color: #fd7e14;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            width: 100%; max-width: 600px;
            background: var(--card-bg-color);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { margin-top: 0; color: var(--text-color); }
        p.description { color: var(--text-muted-color); margin-bottom: 25px; line-height: 1.5; }
        
        /* Khu vực kéo thả file */
        .file-drop-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            transition: background-color 0.2s, border-color 0.2s;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .file-drop-area.dragover {
            background-color: rgba(0, 123, 255, 0.1);
            border-color: var(--primary-color);
        }
        #file-input { display: none; } /* Luôn ẩn input mặc định */

        /* Danh sách file đã chọn/đang upload */
        #files-list { margin-top: 20px; text-align: left; max-height: 200px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; }
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .file-item:last-child { border-bottom: none; }
        .file-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%;}
        .file-item .status { font-weight: bold; }
        .file-item .status.success { color: var(--success-color); }
        .file-item .status.error { color: var(--danger-color); }
        
        /* Các nút bấm */
        .btn { padding: 12px 25px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; font-weight: 500; }
        #upload-btn { background-color: var(--primary-color); color: white; width: 100%; margin-top: 20px; }
        #upload-btn:disabled { background-color: #6c757d; cursor: not-allowed; }
        #complete-btn { background-color: var(--success-color); color: white; margin-top: 20px; }
    </style>
</head>
<body class="dark-mode"> <div class="container">
        <h1 id="upload-title">Công Cụ Upload File</h1>
        <p class="description">Kéo thả file vào khung bên dưới hoặc nhấn để chọn. Bạn có thể chọn nhiều file cùng lúc.</p>
        
        <form id="upload-form">
            <label for="file-input" class="file-drop-area">
                <span id="drop-text">Nhấn vào đây hoặc Kéo thả file</span>
            </label>
            <input type="file" id="file-input" multiple>
            
            <div id="files-list"></div>
            
            <button type="submit" id="upload-btn" class="btn" disabled>Tải Lên Các File Đã Chọn</button>
        </form>
        
        <button id="complete-btn" class="btn">Đóng Cửa Sổ</button>
    </div>

    <script>
    /**
     * @file upload.html's script (phiên bản 3.0 - Ổn định)
     * @description Script này xử lý popup upload một cách an toàn và hiện đại.
     * Sử dụng postMessage để giao tiếp với cửa sổ cha, giải quyết triệt để lỗi "mất link" và "bị đứng".
     */

    document.addEventListener('DOMContentLoaded', () => {
        
        // --- KHỞI TẠO VÀ LẤY CÁC BIẾN CẦN THIẾT ---
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-input');
        const filesListDiv = document.getElementById('files-list');
        const uploadBtn = document.getElementById('upload-btn');
        const doneBtn = document.getElementById('complete-btn');
        const uploadTitle = document.getElementById('upload-title');
        const fileDropArea = document.querySelector('.file-drop-area');
        const dropText = document.getElementById('drop-text');

        // --- KIỂM TRA MÔI TRƯỜNG POPUP ---
        const urlParams = new URLSearchParams(window.location.search);
        const targetTextAreaId = urlParams.get('target');

        // Nếu không hợp lệ, dừng mọi hoạt động
        if (!targetTextAreaId || !window.opener) {
            document.body.innerHTML = '<h1>Lỗi: Trang này phải được mở từ trang chính.</h1>';
            throw new Error("Invalid access: Missing target or opener window.");
        }

        // --- CẬP NHẬT GIAO DIỆN DỰA TRÊN LOẠI FILE ---
        const setupUIForTarget = () => {
            const targets = {
                imageUrls: { title: 'Upload Hình Ảnh Sản Phẩm', accept: 'image/*' },
                drawingUrls: { title: 'Upload Bản Vẽ (PDF)', accept: '.pdf,application/pdf' },
                materialsUrls: { title: 'Upload Vật Tư (Word, Excel, PDF)', accept: '.doc,.docx,.xls,.xlsx,.pdf' }
            };
            const config = targets[targetTextAreaId] || { title: 'Upload File', accept: '*' };
            uploadTitle.textContent = config.title;
            fileInput.accept = config.accept;
        };

        // --- HÀM XỬ LÝ UPLOAD CHÍNH, TẢI TỪNG FILE MỘT ---
        const handleFileUpload = async (file) => {
            const fileId = `file-${file.name.replace(/[^a-zA-Z0-9]/g, '')}-${Date.now()}`;
            
            // Tạo một dòng trạng thái cho file này
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.id = fileId;
            fileItem.innerHTML = `<span class="name" title="${file.name}">${file.name}</span> <span class="status">⬆️ Đang tải...</span>`;
            filesListDiv.appendChild(fileItem);
            
            try {
                const statusEl = document.querySelector(`#${fileId} .status`);
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch('/api/upload-direct', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || `Lỗi server: ${response.status}`);
                }
                
                // === GỬI TIN NHẮN THÀNH CÔNG VỀ TRANG CHA ===
                window.opener.postMessage({
                    type: 'file-uploaded',
                    url: result.accessUrl,
                    target: targetTextAreaId
                }, window.location.origin);
                
                statusEl.textContent = '✔ Thành công!';
                statusEl.classList.add('success');
            } catch (error) {
                const statusEl = document.querySelector(`#${fileId} .status`);
                statusEl.textContent = `❌ Lỗi`;
                statusEl.classList.add('error');
                statusEl.title = error.message; // Thêm chi tiết lỗi khi hover
                console.error(`Lỗi khi tải file ${file.name}:`, error);
            }
        };
        
        // --- GẮN CÁC SỰ KIỆN ---

        const displaySelectedFiles = () => {
            if (fileInput.files.length > 0) {
                dropText.style.display = 'none';
                filesListDiv.innerHTML = Array.from(fileInput.files)
                    .map(f => `<div class="file-item"><span class="name" title="${f.name}">${f.name}</span> <span class="status">Sẵn sàng</span></div>`)
                    .join('');
                uploadBtn.disabled = false;
            } else {
                uploadBtn.disabled = true;
                filesListDiv.innerHTML = '';
                dropText.style.display = 'block';
            }
        };

        fileInput.addEventListener('change', displaySelectedFiles);
        fileDropArea.addEventListener('dragover', (e) => { e.preventDefault(); e.currentTarget.classList.add('dragover'); });
        fileDropArea.addEventListener('dragleave', (e) => e.currentTarget.classList.remove('dragover'));
        fileDropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            displaySelectedFiles();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const files = fileInput.files;
            if (files.length === 0) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Đang xử lý...';
            filesListDiv.innerHTML = ''; // Xóa danh sách "Sẵn sàng"
            
            // Tải các file lên một cách tuần tự (lần lượt) để dễ theo dõi và ổn định hơn
            for (const file of files) {
                await handleFileUpload(file);
            }

            uploadBtn.textContent = 'Đã hoàn tất! Chọn file khác để tải lên tiếp.';
            uploadBtn.disabled = true; // Vô hiệu hóa sau khi xong để phải chọn file mới
            fileInput.value = ''; // Reset input
        });

        doneBtn.addEventListener('click', () => window.close());
        
        // Tự động áp dụng theme từ trang cha cho đồng bộ
        try {
            if (window.opener.document.body.classList.contains('dark-mode')) {
                document.body.classList.add('dark-mode');
            }
        } catch(e) {}

        // Chạy hàm khởi tạo giao diện
        setupUIForTarget();
    });
    </script>
</body>
</html>
