<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị</title>

    <style>
        /* Sử dụng biến màu đã định nghĩa cho theme */
        :root {
            --bg-color: #f8f9fa;
            --card-bg-color: #ffffff;
            --text-color: #212529;
            --text-muted-color: #6c757d;
            --border-color: #dee2e6;
            --primary-color: #007bff;
        }
        body.dark-mode {
            --bg-color: #121212;
            --card-bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted-color: #888;
            --border-color: #333;
            --primary-color: #0d6efd;
        }

        /* Áp dụng biến màu và cải thiện layout */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px;
            background-color: var(--card-bg-color);
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        p {
            font-size: 1.2rem;
            color: var(--text-muted-color);
            margin-bottom: 40px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .nav-links a { 
            display: block; 
            font-size: 18px;
            padding: 15px 25px;
            background-color: var(--primary-color); 
            color: white; 
            text-decoration: none; 
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s;
            font-weight: 500;
        }

        .nav-links a:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        
        /* CSS cho nút gạt theme */
        .theme-switcher { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 8px; }
        .theme-switcher span { font-size: 1.2rem; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }

    </style>
    
    <script>
      (function() {
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch(e) {}
      })();
    </script>
</head>
<body>
    <div class="theme-switcher">
        <span>☀️</span>
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider round"></span>
        </label>
        <span>🌙</span>
    </div>

    <div class="container">
        <h1 id="welcome-message">Chào mừng...</h1>
        <p>Đây là trang quản trị nội bộ. Vui lòng chọn một tác vụ.</p>
        
        <div class="nav-links">
            <div class="nav-grid">
                <a href="/product-list.html">Quản lý Sản phẩm</a>
                <a href="/employee-info.html">Quản lý Nhân viên</a>
                <a href="/message.html">Tin nhắn Nội bộ</a>
            </div>
        </div>
    </div>

    <script src="/js/theme-manager.js"></script>
    <script src="/js/dashboard-logic.js"></script>
    
</body>
</html>
