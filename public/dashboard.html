<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 40px; 
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
            font-size: 2.8rem;
            margin-bottom: 8px;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
        }

        .nav-links a { 
            display: inline-block; 
            margin: 10px; 
            font-size: 18px;
            padding: 12px 25px;
            background-color: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .nav-links a:hover {
            background-color: #0056b3;
        }
        
        .dashboard-image-container {
            margin-top: 50px;
        }
        .dashboard-image-container img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* --- CSS CHO FUN FACT --- */
        .fun-fact {
            margin-top: 40px;
            margin-bottom: 25px; /* Giảm khoảng cách dưới để nhường cho ticker */
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #007bff;
            font-style: italic;
            color: #555;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- CSS CHO BẢNG TIN TÀI CHÍNH (THÊM MỚI) --- */
        .financial-ticker-container {
            padding: 10px;
            background-color: #1a1a1a; /* Nền đen để nổi bật */
            border-radius: 5px;
            max-width: 800px;
            margin: 0 auto 40px auto; /* Tách biệt với các phần khác */
            overflow: hidden; /* Ẩn đi các phần tử tràn ra ngoài */
            height: 40px; /* Cố định chiều cao */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #financial-ticker {
            color: #fff; /* Chữ trắng */
            font-size: 18px;
            font-weight: 500;
            margin: 0;
            padding: 5px 0;
            white-space: nowrap; /* Đảm bảo nội dung trên một dòng */
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; /* Hiệu ứng mượt mà */
            opacity: 1;
            transform: translateY(0);
        }

        /* Class để tạo hiệu ứng ẩn đi */
        #financial-ticker.fading-out {
            opacity: 0;
            transform: translateY(-10px); /* Di chuyển lên trên một chút khi mờ đi */
        }
    </style>
</head>
<body>
    <h1 id="welcome-message">Chào mừng...</h1>
    <p>Đây là trang quản trị nội bộ.</p>
    
    <div class="nav-links">
        <a href="/product-list.html">Quản lý Sản phẩm / Manage Products</a>
    </div>

    <div id="fun-fact-quote" class="fun-fact"></div>

    <div class="financial-ticker-container">
        <p id="financial-ticker"></p>
    </div>

    <div class="dashboard-image-container">
        <img src="https://i.postimg.cc/0Qk1yK9q/unnamed.png" alt="KT Furniture Dashboard Image">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // --- PHẦN 1: LẤY THÔNG TIN NGƯỜI DÙNG ---
            fetch('/api/me')
                .then(response => {
                    if (!response.ok) { throw new Error('Not authenticated'); }
                    return response.json();
                })
                .then(data => {
                    if (data && data.name) {
                        document.getElementById('welcome-message').textContent = 'Chào mừng, ' + data.name + '!';
                    } else {
                        throw new Error('User data not found');
                    }
                })
                .catch(error => {
                    console.error('Lỗi xác thực:', error);
                    window.location.href = '/'; 
                });

            // --- PHẦN 2: HIỂN THỊ FUN FACT NGẪU NHIÊN ---
            const funFacts = [

                "Logo của FedEx có một mũi tên ẩn giữa chữ 'E' và 'x', tượng trưng cho tốc độ và sự chính xác.",
                "Google ban đầu được đặt tên là 'Backrub'.",
                "Warren Buffett vẫn sống trong ngôi nhà ông mua vào năm 1958 với giá chỉ 31,500 USD.",
                "Người sáng lập Nike, Phil Knight, ban đầu chỉ bán giày từ thùng xe hơi của mình.",
                "Steve Jobs bị sa thải khỏi Apple vào năm 1985, sau đó ông quay lại và biến nó thành công ty giá trị nhất thế giới.",
                "Netflix được thành lập sau khi người sáng lập Reed Hastings bị phạt 40 USD vì trả muộn một cuốn băng VHS phim Apollo 13.",
                "Slogan 'Just Do It' của Nike được lấy cảm hứng từ những lời cuối cùng của một tử tù ở Utah.",
                "Hơn 50% số công ty trong danh sách Fortune 500 của năm 1955 đã không còn tồn tại.",
                "Bill Gates đã từng nói rằng ông sẽ nghỉ hưu khi trở thành triệu phú, nhưng điều đó đã không xảy ra.",
                "Người sáng lập IKEA, Ingvar Kamprad, nổi tiếng là người cực kỳ tiết kiệm, thường xuyên đi xe bus dù là tỷ phú.",
                "Thương hiệu Coca-Cola được nhận diện bởi 94% dân số thế giới.",
                "Mỗi ngày, McDonald's phục vụ khoảng 68 triệu người, nhiều hơn dân số của cả nước Anh.",
                "Henry Ford đã tăng lương công nhân lên gấp đôi vào năm 1914, không phải vì lòng tốt, mà để họ có đủ tiền mua chính những chiếc xe họ làm ra.",
                "Nhà đầu tư huyền thoại Peter Lynch cho rằng 'Hãy đầu tư vào những gì bạn biết'.",

                "Starbucks bán được hơn 4 triệu ly cà phê mỗi ngày.",
                "Walt Disney từng bị một tờ báo sa thải vì 'thiếu trí tưởng tượng và không có ý tưởng hay'.",
                "Rolex là một tổ chức phi lợi nhuận. Lợi nhuận của công ty được dùng cho các hoạt động từ thiện.",

                "80% các triệu phú là thế hệ tự thân làm giàu đầu tiên.",
                "Sản phẩm đầu tiên của Sony là một chiếc nồi cơm điện.",
                "Samsung ban đầu là một công ty buôn bán mỳ và hàng tạp hóa.",
                "Harland Sanders (Người sáng lập KFC) đã bị từ chối 1009 lần trước khi công thức gà rán của ông được chấp nhận.",
                "Tên 'LEGO' bắt nguồn từ cụm từ 'leg godt' trong tiếng Đan Mạch, có nghĩa là 'chơi hay'.",

                "'Stay hungry, stay foolish' (Hãy cứ khát khao, hãy cứ dại khờ) là câu nói kết thúc bài phát biểu nổi tiếng của Steve Jobs tại Đại học Stanford.",
                "90% các startup thất bại.",
                "Người sáng lập Twitter, Jack Dorsey, ban đầu hình dung nó là một dịch vụ tin nhắn SMS nội bộ cho công ty của mình.",
                "Để thành công, bạn cần phải có một ý tưởng và không có gì khác ngoài sự thực thi hoàn hảo. - Michael Dell",
                "Lý do tốt nhất để thành lập một công ty là để tạo ra ý nghĩa; để tạo ra một sản phẩm hoặc dịch vụ giúp thế giới trở nên tốt đẹp hơn. - Guy Kawasaki",
                "Đừng lo lắng về thất bại; bạn chỉ cần đúng một lần duy nhất. - Drew Houston, người sáng lập Dropbox.",
                "Thành công thường đến với những người quá bận rộn để đi tìm nó. - Henry David Thoreau",
                "Thời gian của bạn có hạn, đừng lãng phí nó để sống cuộc đời của người khác. - Steve Jobs",
                "Một thương hiệu đối với một công ty cũng giống như danh tiếng đối với một người. Bạn có được danh tiếng bằng cách cố gắng làm tốt những việc khó khăn. - Jeff Bezos",
                "Rủi ro lớn nhất là không chấp nhận bất kỳ rủi ro nào. - Mark Zuckerberg",
                "Nếu bạn không tự xây dựng ước mơ của mình, người khác sẽ thuê bạn để xây dựng ước mơ của họ.",
                "Lamborghini ban đầu là một công ty sản xuất máy kéo.",
                "Howard Schultz đã bị từ chối 217 lần khi kêu gọi vốn để thành lập Starbucks.",
                "Khách hàng không mua sản phẩm và dịch vụ. Họ mua các mối quan hệ, những câu chuyện và phép màu. - Seth Godin",
                "Bạn không cần một ý tưởng mang tính cách mạng. Bạn chỉ cần một sản phẩm tốt hơn 10% so với đối thủ.",
                "Nokia ban đầu là một nhà máy sản xuất giấy.",
                "Microsoft đã tạo ra một chiếc smartwatch vào năm 1994, 20 năm trước khi Apple Watch ra đời.",
                "Người bình thường có một mục tiêu. Người thành công có một hệ thống.",
                "Đừng bao giờ từ bỏ một giấc mơ chỉ vì thời gian cần để thực hiện nó. Thời gian rồi cũng sẽ trôi đi. - Earl Nightingale",
                "Cách để bắt đầu là ngừng nói và bắt đầu làm. - Walt Disney",
                "Nếu bạn sinh ra trong nghèo khó, đó không phải là lỗi của bạn. Nhưng nếu bạn chết trong nghèo khó, đó là lỗi của bạn. - Bill Gates"
            ];
            const quoteElement = document.getElementById('fun-fact-quote');
            if (quoteElement) {
                const randomIndex = Math.floor(Math.random() * funFacts.length);
                const randomFact = funFacts[randomIndex];
                quoteElement.innerHTML = `💡 <strong>Có thể bạn chưa biết:</strong> "${randomFact}"`;
            }

            // --- PHẦN 3: HIỂN THỊ BẢNG TIN TÀI CHÍNH TỰ ĐỘNG LẬT (Code thêm mới) ---
            const financialData = [
                '<strong>VN-INDEX:</strong> 1,282.15 pts <span style="color:#33ff99;">(+0.75%)</span>',
                '<strong>Giá vàng SJC:</strong> 76.98 triệu/lượng (bán ra)',
                '<strong>Tỷ giá USD/VND:</strong> 25,450 <span style="color:#ff5733;">(-25đ)</span>',
                '<strong>Tỷ giá EUR/VND:</strong> 27,610',
                '<strong>Tỷ giá JPY/VND:</strong> 162.50',
                '<strong>S&P 500:</strong> 5,480.40 pts <span style="color:#33ff99;">(+0.90%)</span>',
                '<strong>Giá dầu Brent:</strong> $85.50/thùng',
                '<strong>Bitcoin (BTC):</strong> $68,500.75 <span style="color:#33ff99;">(+2.1%)</span>',
                '<strong>Cổ phiếu FPT:</strong> 135,500đ/cp',
                '<strong>Cổ phiếu HPG (Hòa Phát):</strong> 28,900đ/cp <span style="color:#ff5733;">(-0.5%)</span>',
                '<strong>Dow Jones:</strong> 39,112.16 pts <span style="color:#33ff99;">(+0.6%)</span>',
                '<strong>Lãi suất tiết kiệm (12 tháng):</strong> ~4.8%/năm',
                '<strong>Ethereum (ETH):</strong> $3,550.30',
                '<strong>Nasdaq Composite:</strong> 17,689.80 pts <span style="color:#33ff99;">(+1.2%)</span>',
                '<strong>Vốn hóa thị trường VN:</strong> ~6.8 triệu tỷ VNĐ',
                '<strong>Giá vàng 9999:</strong> 74.10 triệu/lượng',
                '<strong>Cổ phiếu VNM (Vinamilk):</strong> 66,200đ/cp',
                '<strong>Tỷ giá AUD/VND:</strong> 16,950',
                '<strong>Cổ phiếu TCB (Techcombank):</strong> 22,700đ/cp <span style="color:#33ff99;">(+1.1%)</span>',
                '<strong>GDP Việt Nam (dự báo):</strong> tăng trưởng ~6.5%',
                '<strong>Giá cà phê Robusta:</strong> 120,500đ/kg',
                '<strong>Hang Seng Index:</strong> 18,027.71 pts <span style="color:#ff5733;">(-0.8%)</span>',
                '<strong>Cổ phiếu VIC (Vingroup):</strong> 42,400đ/cp',
                '<strong>Lạm phát (CPI):</strong> mục tiêu dưới 4.5%',
                '<strong>Giá Bạc (Silver):</strong> $29.50/ounce',
                '<strong>Tỷ giá GBP/VND:</strong> 32,250',
                '<strong>Cổ phiếu MWG (Thế Giới Di Động):</strong> 63,800đ/cp',
                '<strong>Chỉ số Nikkei 225:</strong> 39,215.00 pts',
                '<strong>Giá gạo 5% tấm (XK):</strong> ~$580/tấn',
                '<strong>Dự trữ ngoại hối:</strong> ~110 tỷ USD'
            ];
            const tickerElement = document.getElementById('financial-ticker');
            if (tickerElement) {
                let currentDataIndex = 0;
                // Hàm để cập nhật nội dung ticker
                function updateTicker() {
                    tickerElement.classList.add('fading-out');
                    setTimeout(() => {
                        currentDataIndex = (currentDataIndex + 1) % financialData.length;
                        tickerElement.innerHTML = financialData[currentDataIndex];
                        tickerElement.classList.remove('fading-out');
                    }, 500);
                }
                // Hiển thị thông tin đầu tiên và bắt đầu chu kỳ
                tickerElement.innerHTML = financialData[0];
                setInterval(updateTicker, 10000); // Đổi thông tin mỗi 10 giây
            }
        });
    </script>
</body>
</html>
