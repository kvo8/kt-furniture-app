<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 40px; 
            background-color: #f4f4f9;
        }

       h1 {
    font-size: 3rem; /* Tăng kích thước chữ lên một chút */
    font-weight: 700; /* Làm chữ đậm hơn */
    margin-bottom: 8px;
    
    /* --- Hiệu ứng Gradient và Highlight --- */
    /* Tạo dải màu gradient đẹp mắt */
    background: linear-gradient(60deg, #2c3e50, #3498db, #2980b9);
    
    /* Áp dụng gradient làm màu cho chữ */
    color: transparent; /* Ẩn màu chữ gốc */
    -webkit-background-clip: text; /* Cho trình duyệt Chrome/Safari */
    background-clip: text;
    
    /* Thêm bóng mờ nhẹ để chữ nổi bật hơn */
    text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
}

        p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
        }

        .nav-links a { 
            /* --- Kích thước & Font chữ --- */
            display: inline-block;
            padding: 18px 40px;     /* Tăng mạnh padding để nút to và rộng hơn */
            margin: 10px;
            font-size: 1.2rem;      /* Tăng kích thước chữ cho dễ đọc */
            font-weight: 700;       /* Chữ đậm, rõ ràng */
            text-decoration: none;
            text-transform: uppercase; /* Viết hoa toàn bộ cho cảm giác quan trọng */
            letter-spacing: 1px;    /* Tăng khoảng cách giữa các chữ */

            /* --- Màu sắc & Hiệu ứng Highlights --- */
            color: #ffffff;         /* Màu chữ trắng */
            /* Tạo dải màu gradient cho nút thêm sinh động */
            background: linear-gradient(45deg, #0d6efd, #0a58ca); 
            border: none;           /* Bỏ viền mặc định */
            border-radius: 50px;    /* Bo góc tròn cho mềm mại, hiện đại */
            /* Đổ bóng để nút nổi lên khỏi nền */
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4); 
            
            /* --- Hiệu ứng chuyển động & Tương tác --- */
            transition: all 0.3s ease-in-out; /* Giúp mọi thay đổi đều mượt mà */
        }

        .nav-links a:hover {
            transform: translateY(-3px); /* Nút sẽ nhích lên một chút */
            box-shadow: 0 8px 25px rgba(13, 110, 253, 0.5); /* Bóng đổ sẽ đậm và rộng hơn */
            filter: brightness(1.1);      /* Nút sẽ sáng lên một chút */
            background: linear-gradient(45deg, #0d6efd, #0a58ca); /* Giữ lại gradient khi hover */
        }
        .dashboard-image-container {
            margin-top: 50px;
        }
        .dashboard-image-container img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* --- CSS CHO FUN FACT --- */
        .fun-fact {
            margin-top: 40px;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #007bff;
            font-style: italic;
            color: #555;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- CSS CHO BẢNG TIN TÀI CHÍNH --- */
        .financial-ticker-container {
            padding: 10px;
            background-color: #1a1a1a; /* Nền đen */
            border-radius: 5px;
            max-width: 800px;
            margin: 0 auto 15px auto; /* Giảm khoảng cách dưới */
            overflow: hidden;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #financial-ticker {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            margin: 0;
            padding: 5px 0;
            white-space: nowrap;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }

        #financial-ticker.fading-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* --- CSS CHO BẢNG TIN THỜI SỰ (THÊM MỚI) --- */
        .news-ticker-container {
            padding: 10px;
            background-color: #b32a2a; /* Nền đỏ */
            border-radius: 5px;
            max-width: 850px;
            margin: 0 auto 40px auto; /* Khoảng cách với ảnh */
            overflow: hidden;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #news-ticker {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            margin: 0;
            padding: 5px 0;
            white-space: nowrap;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }

        #news-ticker.fading-out {
            opacity: 0;
            transform: translateY(-10px);
        }
    </style>
</head>

                'Dân số thế giới dự kiến đạt 8.5 tỷ người vào cuối năm nay.',
                'Một loại vắc-xin cúm phổ thông mới cho thấy hiệu quả cao trong các thử nghiệm lâm sàng.',
                'Cuộc đua không gian thương mại nóng lên với sự tham gia của nhiều công ty tư nhân mới.',
                'An ninh mạng trở thành ưu tiên hàng đầu của các chính phủ sau loạt tấn công quy mô lớn.',
                'Giải Nobel Hòa bình được trao cho một tổ chức hoạt động vì quyền của người tị nạn.',
                'Kinh tế Ấn Độ được dự báo sẽ vượt qua Nhật Bản để trở thành nền kinh tế lớn thứ ba thế giới.',
                'Trí tuệ nhân tạo tạo sinh (Generative AI) bắt đầu được ứng dụng trong ngành giáo dục.',
                'Sự kiện thể thao World Cup Nữ phá vỡ mọi kỷ lục về lượng người xem.'
            ];
            const newsTickerElement = document.getElementById('news-ticker');
            if (newsTickerElement) {
                let currentNewsIndex = 0;
                function updateNewsTicker() {
                    newsTickerElement.classList.add('fading-out');
                    setTimeout(() => {
                        currentNewsIndex = (currentNewsIndex + 1) % newsHeadlines.length;
                        newsTickerElement.innerHTML = `<strong>TIN NÓNG:</strong> ${newsHeadlines[currentNewsIndex]}`;
                        newsTickerElement.classList.remove('fading-out');
                    }, 500);
                }
                newsTickerElement.innerHTML = `<strong>TIN NÓNG:</strong> ${newsHeadlines[0]}`;
                setInterval(updateNewsTicker, 10000);
            }

        });
    </script>
</body>
</html>
