<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Sạc Năng Lượng Tâm Hồn 2.0</title>
    <style>
        :root {
            --primary-color: #6f42c1;
            --user-bubble-color: #007bff;
            --ai-bubble-color: #e4e6eb;
            --background-color: #f0f2f5;
            --container-bg-color: white;
            --text-primary-color: #050505;
            --text-secondary-color: #65676b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 90vh;
            max-height: 800px;
            background-color: var(--container-bg-color);
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), #8a63d2);
            color: white;
            text-align: center;
            flex-shrink: 0;
        }
        .chat-header h2 { margin: 0; font-size: 1.6em; }
        .chat-header p { margin: 5px 0 0; opacity: 0.9; }

        .chat-log {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .ai-message { align-items: flex-start; }
        .user-message { align-items: flex-end; margin-left: auto; }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.5;
        }
        .ai-message .message-bubble {
            background-color: var(--ai-bubble-color);
            color: var(--text-primary-color);
            border-bottom-left-radius: 4px;
        }
        .user-message .message-bubble {
            background-color: var(--user-bubble-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 10px;
        }
        .typing-indicator span {
            height: 8px; width: 8px; background-color: #B0B3B8;
            border-radius: 50%; display: inline-block; margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        .chat-footer {
            flex-shrink: 0;
            border-top: 1px solid #ddd;
        }
        .user-options {
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .user-options button {
            padding: 10px 15px;
            font-size: 1em;
            border: 1px solid #ccc;
            background-color: var(--container-bg-color);
            color: var(--text-primary-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .user-options button:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }
        .user-options button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        #chat-input-form {
            display: flex;
            padding: 10px;
            gap: 10px;
            background-color: #f9f9f9;
        }
        #chat-input {
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 1em;
        }
        #chat-input:focus { outline: none; border-color: var(--primary-color); }
        #send-button {
            border: none;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            width: 44px; height: 44px;
            font-size: 1.5em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #send-button:hover { background-color: #59359a; }

        .disclaimer { text-align: center; font-size: 12px; color: var(--text-secondary-color); padding: 10px 15px 15px; background-color: #f9f9f9;}
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Dr. Gen Z</h2>
            <p>Chuyên gia lắng nghe & "gỡ rối" tơ lòng</p>
        </div>
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-footer">
            <div class="user-options" id="user-options"></div>
            <form id="chat-input-form">
                <input type="text" id="chat-input" placeholder="Hoặc chia sẻ thêm ở đây...">
                <button type="submit" id="send-button">➤</button>
            </form>
            <p class="disclaimer">Lưu ý: Đây là một AI mô phỏng và không thay thế cho tư vấn tâm lý chuyên nghiệp.</p>
        </div>
    </div>

    <script>
    const chatLog = document.getElementById('chat-log');
    const userOptions = document.getElementById('user-options');
    const inputForm = document.getElementById('chat-input-form');
    const textInput = document.getElementById('chat-input');

    // Cây hội thoại phức tạp hơn
    const conversationTree = {
        start: {
            message: "Xin chào bạn yêu! Tôi là Dr. Gen Z, chuyên gia 'bắt bệnh' cảm xúc đây. Hôm nay, có chuyện gì khiến 'ra-đa' của bạn rung rinh thế? 😉",
            options: [
                { text: "Tôi đang stress...", next: 'stress_intro' },
                { text: "Cảm thấy mất động lực", next: 'motivation_intro' },
                { text: "Tâm trạng hơi buồn...", next: 'sadness_intro' },
                { text: "Chuyện tình cảm 'toang'", next: 'love_intro' }
            ]
        },
        stress_intro: {
            message: "Stress à? Tôi hiểu, cảm giác như 'gánh team' 24/7 mà không có KPI. Cụ thể hơn, bạn đang stress về chuyện gì thế?",
            options: [
                { text: "Áp lực công việc", next: 'stress_work' },
                { text: "Chuyện học hành", next: 'stress_study' },
                { text: "Áp lực từ gia đình", next: 'stress_family' },
                { text: "Quay lại", next: 'start' }
            ]
        },
        stress_work: {
            message: "Deadline dí sát nút, sếp thì khó tính, đồng nghiệp thì 'toxic'... quen quá rồi. Để 'xả stress' hiệu quả, bạn hãy thử hít một hơi thật sâu và thở ra từ từ. Nó giúp 'hạ nhiệt' cho bộ não của bạn đó.",
            options: [ { text: "Cảm ơn Dr. Gen Z!", next: 'final_thanks' } ]
        },
        stress_study: {
            message: "Núi bài tập và những kỳ thi bất tận, thật là một 'kiếp nạn'. Đừng cố gắng 'cày' một lúc. Hãy áp dụng quy tắc Pomodoro: học 25 phút, nghỉ 5 phút. Nó sẽ giúp bạn 'hack' não và học hiệu quả hơn nhiều.",
            options: [ { text: "Cảm ơn Dr. Gen Z!", next: 'final_thanks' } ]
        },
        stress_family: {
            message: "Kỳ vọng của gia đình đôi khi nặng như 'gánh tạ'. Hãy nhớ rằng, bạn có giá trị riêng của mình. Thử tìm một thời điểm thích hợp để nhẹ nhàng chia sẻ cảm xúc của mình với bố mẹ xem sao. Giao tiếp là chìa khóa đó.",
            options: [ { text: "Cảm ơn Dr. Gen Z!", next: 'final_thanks' } ]
        },
        motivation_intro: {
            message: "Mất động lực giống như điện thoại hết pin vậy, chẳng muốn làm gì cả. Bạn có cảm thấy kiệt sức hay chỉ đơn giản là không còn hứng thú với mọi thứ?",
            options: [
                { text: "Tôi cảm thấy kiệt sức", next: 'motivation_burnout' },
                { text: "Mất hết hứng thú", next: 'motivation_bored' },
                { text: "Quay lại", next: 'start' }
            ]
        },
        motivation_burnout: {
            message: "Kiệt sức (burnout) là tín hiệu 'cầu cứu' của cơ thể. Bạn cần 'sạc pin' ngay lập tức! Hãy cho phép mình nghỉ ngơi thực sự, không check mail, không lướt mạng xã hội. Một giấc ngủ ngon có thể тạo ra phép màu.",
            options: [ { text: "Cảm ơn Dr. Gen Z!", next: 'final_thanks' } ]
        },
        motivation_bored: {
            message: "Mất hứng thú có thể là do bạn đang lặp lại những điều cũ kỹ. Hãy thử một thứ gì đó hoàn toàn mới: đọc một thể loại sách khác, đi một con đường lạ, hoặc học một kỹ năng không liên quan gì đến công việc. Nó sẽ 'F5' lại tâm trí bạn.",
            options: [ { text: "Cảm ơn Dr. Gen Z!", next: 'final_thanks' } ]
        },
        sadness_intro: {
            message: "Buồn bã là một đám mây xám. Nhưng sau cơn mưa trời lại sáng. Cứ cho phép mình được buồn, được khóc nếu muốn. Đó là một cách chữa lành rất tự nhiên.",
            options: [ { text: "Cảm ơn Dr. Gen Z!", next: 'final_thanks' } ]
        },
        love_intro: {
            message: "Ôi chuyện tình cảm, phức tạp như thuật toán của TikTok vậy. 'Va' phải 'red flag' hay sao thế?",
            options: [
                { text: "Đúng rồi, toang thật sự!", next: 'love_redflag' },
                { text: "Chỉ là hơi 'cảm nắng'", next: 'love_crush' },
                 { text: "Quay lại", next: 'start' }
            ]
        },
        love_redflag: {
            message: "Gặp 'red flag' thì phải 'quay xe' ngay và luôn! Đừng tiếc. Bạn xứng đáng với một người tôn trọng và yêu thương bạn. 'Block' đi cho nhẹ lòng, rồi tự thưởng cho mình một bữa thật ngon nhé!",
            options: [ { text: "Cảm ơn Dr. Gen Z!", next: 'final_thanks' } ]
        },
        love_crush: {
            message: "'Cảm nắng' là một cảm giác thật tuyệt! Cứ tận hưởng đi. Đừng quá lo lắng về kết quả, hãy trân trọng những rung động trong sáng này. Biết đâu 'happy ending' đang chờ bạn thì sao?",
            options: [ { text: "Cảm ơn Dr. Gen Z!", next: 'final_thanks' } ]
        },
        final_thanks: {
            message: "Không có gì! Tôi rất vui vì đã có thể lắng nghe. Hãy nhớ, mọi cảm xúc đều đáng được trân trọng. Cần 'sạc năng lượng' thì cứ tìm tôi nhé!",
            options: [ { text: "Trò chuyện lại từ đầu", next: 'start' } ]
        },
        text_fallback: {
            message: "Cảm ơn bạn đã chia sẻ. Tôi đang lắng nghe đây. Việc nói ra được cảm xúc của mình đã là một bước rất dũng cảm rồi.",
            options: [] // Sẽ hiển thị lại các nút cũ
        }
    };

    let currentNodeKey = 'start'; // Theo dõi vị trí hiện tại trong cây hội thoại

    // ----- CÁC HÀM XỬ LÝ -----

    const addMessage = (sender, text) => {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message ${sender}-message`;
        messageDiv.innerHTML = `<div class="message-bubble">${text}</div>`;
        chatLog.appendChild(messageDiv);
        chatLog.scrollTop = chatLog.scrollHeight;
    };

    const showTypingIndicator = () => {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'chat-message ai-message typing-indicator';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        typingDiv.id = 'typing';
        chatLog.appendChild(typingDiv);
        chatLog.scrollTop = chatLog.scrollHeight;
    };

    const hideTypingIndicator = () => {
        const typingDiv = document.getElementById('typing');
        if (typingDiv) chatLog.removeChild(typingDiv);
    };

    const setOptions = (options) => {
        userOptions.innerHTML = '';
        if (!options) return;

        options.forEach(option => {
            const button = document.createElement('button');
            button.textContent = option.text;
            button.dataset.next = option.next;
            userOptions.appendChild(button);
        });
    }

    const processAiTurn = async (nodeKey) => {
        currentNodeKey = nodeKey;
        const node = conversationTree[nodeKey];
        if (!node) return;

        // Xử lý tin nhắn của AI
        const messages = Array.isArray(node.message) ? node.message : [node.message];
        for (const msg of messages) {
            showTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 500));
            hideTypingIndicator();
            addMessage('ai', msg);
        }

        // Hiển thị các lựa chọn mới
        setOptions(node.options);
    };

    const handleOptionClick = (event) => {
        if (event.target.tagName !== 'BUTTON') return;
        
        const userChoiceText = event.target.textContent;
        const nextNodeKey = event.target.dataset.next;

        // Vô hiệu hóa các nút hiện tại
        userOptions.querySelectorAll('button').forEach(btn => btn.disabled = true);

        addMessage('user', userChoiceText);
        processAiTurn(nextNodeKey);
    };
    
    const handleTextInput = async (event) => {
        event.preventDefault();
        const userText = textInput.value.trim();
        if (!userText) return;

        addMessage('user', userText);
        textInput.value = '';

        // Phản hồi chung của AI
        const fallbackNode = conversationTree['text_fallback'];
        showTypingIndicator();
        await new Promise(resolve => setTimeout(resolve, 1500));
        hideTypingIndicator();
        addMessage('ai', fallbackNode.message);

        // Hiển thị lại các nút của node hiện tại để người dùng tiếp tục
        setOptions(conversationTree[currentNodeKey].options);
    };

    // ----- KHỞI CHẠY -----
    
    userOptions.addEventListener('click', handleOptionClick);
    inputForm.addEventListener('submit', handleTextInput);

    // Bắt đầu cuộc trò chuyện
    processAiTurn('start');

    </script>
</body>
</html>
